name: Simple README Translation

on:
  push:
    branches:
      - master
    paths:
      - 'README.md'
  workflow_dispatch:

jobs:
  translate-simple:
    name: Simple README Translation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install translation dependencies
        run: |
          pip install requests

      - name: Create translation script
        run: |
          cat > translate_simple.py << 'EOF'
          import os
          import re
          import requests

          # Protected list of project names and terminology
          PROTECTED_TERMS = [
              'Sunshine', 'README', 'GitHub', 'CI', 'API', 'Markdown', 'OpenAI', 'DeepL', 'Google Translate',
              # Add more terms here as needed
          ]

          def mask_terms(text):
              for term in PROTECTED_TERMS:
                  text = re.sub(rf'(?<![`\w]){re.escape(term)}(?![`\w])', f'@@@{term}@@@', text)
              return text

          def unmask_terms(text):
              for term in PROTECTED_TERMS:
                  text = text.replace(f'@@@{term}@@@', term)
              return text

          def translate_with_deepseek(text, target_lang):
              # Translate using the DeepSeek API
              api_key = os.getenv('DEEPSEEK_API_KEY')
              if not api_key:
                  raise Exception('DEEPSEEK_API_KEY environment variable is not set')
              url = 'https://api.deepseek.com/v1/chat/completions'
              prompt = f"Please translate the following Markdown content into {target_lang}, but do not translate the project name or these terms: {', '.join(PROTECTED_TERMS)}. Preserve the original formatting, links, and images.\n\n{text}"
              headers = {
                  'Authorization': f'Bearer {api_key}',
                  'Content-Type': 'application/json'
              }
              payload = {
                  "model": "deepseek-chat",
                  "messages": [{"role": "user", "content": prompt}],
                  "temperature": 0.2
              }
              resp = requests.post(url, headers=headers, json=payload)
              resp.raise_for_status()
              result = resp.json()
              return result['choices'][0]['message']['content']

          def translate_readme():
              with open('README.md', 'r', encoding='utf-8') as f:
                  content = f.read()

              languages = [
                  ('en', 'English'),
                  ('fr', 'French'),
                  ('de', 'German'),
                  ('ja', 'Japanese')
              ]

              for lang_code, lang_name in languages:
                  try:
                      if lang_code == 'zh_CN':
                          translated_content = content
                      else:
                          masked = mask_terms(content)
                          translated = translate_with_deepseek(masked, lang_name)
                          translated = unmask_terms(translated)
                          # Strip the extra prefix DeepSeek returns; keep only the first Markdown heading and everything after it
                          lines = translated.splitlines()
                          for idx, line in enumerate(lines):
                              if line.strip().startswith('#'):
                                translated_content = '\n'.join(lines[idx:])
                                break
                          else:
                            translated_content = translated.strip()

                      filename = f'README.{lang_code}.md'
                      with open(filename, 'w', encoding='utf-8') as f:
                          f.write(translated_content)
                      print(f"✓ Translated to {lang_name} ({lang_code})")
                  except Exception as e:
                      print(f"✗ Failed to translate to {lang_name}: {e}")

          if __name__ == "__main__":
              translate_readme()
          EOF

      - name: Run translation
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python translate_simple.py

      - name: Add language selector to README
        run: |
          # Check if language selector already exists
          if grep -q "Multi-language Support" README.md; then
            echo "Language selector already exists, skipping..."
          else
            # Create a backup of the original README
            cp README.md README.md.backup

            # Create the language selector content
            cat > language_selector.md << 'EOF'

          ## 🌐 Multi-language Support

          <div align="center">

          [![English](https://img.shields.io/badge/English-README.md-blue?style=for-the-badge)](README.md)
          [![Français](https://img.shields.io/badge/Français-README.fr.md-green?style=for-the-badge)](README.fr.md)
          [![Deutsch](https://img.shields.io/badge/Deutsch-README.de.md-yellow?style=for-the-badge)](README.de.md)
          [![Japanese](https://img.shields.io/badge/Japanese-README.ja.md-purple?style=for-the-badge)](README.ja.md)

          </div>

          ---

          EOF
            
            # Insert language selector after the first line (title)
            head -n 1 README.md > README.md.new
            cat language_selector.md >> README.md.new
            tail -n +2 README.md >> README.md.new
            
            # Replace the original file
            mv README.md.new README.md
            
            # Clean up
            rm language_selector.md
            
            echo "✓ Added language selector to main README"
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "docs: add multi-language README translations with language selector"
          body: |
            ## Automated translation update

            This PR contains README translations in the following languages:

            - English (en)
            - French (fr)
            - German (de)
            - Japanese (ja)

            ### Translation notes
            - Translated automatically via the Google Translate API
            - Preserves the original Markdown formatting
            - Keeps all links and images
            - Manual review of the translations is recommended

            ### Generated files
            - `README.en.md` - English version
            - `README.fr.md` - French version
            - `README.de.md` - German version
            - `README.ja.md` - Japanese version

            ### New features
            - A language selector has been added to the main README
            - Users can quickly switch to different language versions via the badges
            - Supports quick switching between 5 languages

            ---

            *This PR is generated automatically by CI when README.md is updated.*
          branch: docs/translations
          delete-branch: true
          commit-message: "docs: add multi-language README translations with language selector [skip ci]"

      - name: Create summary
        run: |
          echo "## Translation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The following README translations were generated:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for file in README.*.md; do
            if [ -f "$file" ]; then
              lang=$(echo $file | sed 's/README\.\(.*\)\.md/\1/')
              echo "- $lang" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✓ Language selector added to main README" >> $GITHUB_STEP_SUMMARY