# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
early_access: true

reviews:
  profile: chill
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  collapse_walkthrough: false
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_prs: true
  poem: false
  review_status: true
  review_details: true

  path_filters:
    - "!third-party/**"
    - "!node_modules/**"
    - "!build/**"
    - "!cmake-*/**"
    - "!docs/doxyconfig*"
    - "!**/*.log"
    - "!package-lock.json"
    - "!**/*.obj"
    - "!**/*.etl"
    - "!**/*.csv"
    - "!**/*.cat"
    - "!**/*.bmp"

  path_instructions:
    - path: "src/**/*.{cpp,c,h}"
      instructions: >
        Sunshine core C++ sources for the self-hosted game streaming server. Review focus:
        memory safety, thread safety, RAII resource management, security vulnerabilities.
        Pay attention to platform-specific code controlled by preprocessor macros.
    - path: "src/platform/**"
      instructions: >
        Platform abstraction layer code (Windows/Linux/macOS). Make sure the
        implementations across platforms are consistent, and pay attention to
        error handling and resource cleanup around Windows API calls.
    - path: "cmake/**"
      instructions: >
        CMake build system files. Review cross-platform compatibility and modern CMake practices.
    - path: "src_assets/**/*.{vue,js,html}"
      instructions: >
        Vue.js-based web configuration panel. Review XSS/CSRF security,
        component design, state management, and accessibility.
    - path: "docker/**"
      instructions: >
        Docker configuration files. Review minimal base images, layer caching, and security.
    - path: "packaging/**"
      instructions: >
        Packaging configuration (Inno Setup, Flatpak, DEB, etc.). Review install paths,
        permission settings, and the correctness of dependency declarations.
    - path: "tests/**"
      instructions: >
        Test files. Verify test coverage, edge cases, and assertion correctness.

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - master

  tools:
    cppcheck:
      enabled: true
    shellcheck:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  learnings:
    scope: auto
